# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Optional refreshes: uncomment these lines (cron is UTC; default branch only).
  # schedule:
  #   - cron: "17 6 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Find last successful BlueMap state
        id: map-state
        uses: actions/github-script@v7
        with:
          script: |
            // Recover only this workflow's successful main-branch runs.
            const runs = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'nextjs.yml', branch: 'main',
              status: 'success', per_page: 100
            });
            for await (const page of runs) {
              for (const run of page.data) {
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: run.id, per_page: 100
                });
                if (artifacts.some(a => a.name === 'bluemap-state' && !a.expired)) {
                  core.setOutput('run-id', String(run.id));
                  return;
                }
              }
            }
      - name: Download last successful BlueMap state
        if: steps.map-state.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: bluemap-state
          path: .bluemap/restore
          github-token: ${{ github.token }}
          run-id: ${{ steps.map-state.outputs.run-id }}
      - name: Restore renderer data and last successful map
        if: steps.map-state.outputs.run-id != ''
        run: |
          mkdir -p .bluemap/current
          tar -xzf .bluemap/restore/state.tar.gz -C .bluemap/current
      - name: Setup BlueMap Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Check map scripts
        run: node --test scripts/bluemap/snapshot.test.mjs scripts/bluemap/publish.test.mjs scripts/bluemap/render.test.mjs
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Refresh map and validate the complete Pages export
        id: map
        run: node scripts/bluemap/refresh.mjs
        env:
          EXAROTON_API_TOKEN: ${{ secrets.EXAROTON_API_TOKEN }}
          EXAROTON_SERVER_ID: ${{ vars.EXAROTON_SERVER_ID }}
          EXAROTON_WORLD_PATH: ${{ vars.EXAROTON_WORLD_PATH || 'world' }}
          EXAROTON_REGION_PATH: ${{ vars.EXAROTON_REGION_PATH }}
          BLUEMAP_WORLD_SOURCE: ${{ vars.BLUEMAP_WORLD_SOURCE }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Package complete renderer state
        if: steps.map.outputs.has-state == 'true'
        run: |
          mkdir -p .bluemap/archive
          tar -czf .bluemap/archive/state.tar.gz -C .bluemap/current data web render.json manifest.json
      - name: Preserve complete BlueMap state for future runs
        if: steps.map.outputs.has-state == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bluemap-state
          path: .bluemap/archive/state.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
