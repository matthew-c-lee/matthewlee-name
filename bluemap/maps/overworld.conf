# The script stages each offline snapshot here before running the CLI.
world: "world"
dimension: "minecraft:overworld"
name: "Overworld"
storage: "file"
# Shared render and download bounds: a 2,000 x 2,000-block square at every height.
render-mask: [
  {
    type: "box"
    min-x: -1000
    max-x: 999
    min-z: -1000
    max-z: 999
  }
]
enable-hires: true
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
check-for-removed-regions: true
